plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zjh1934.mausbot.local'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zjh1934.mausbot.local'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            // debug 使用 Android 自带调试签名，产物可直接安装
            debuggable true
        }
        release {
            minifyEnabled false
            // 未配置正式签名；release 产物用于体验，安装以 debug 包为准
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 固定产物名，便于 Actions 上传与用户识别
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "mausbot-local-${variant.name}.apk"
        }
    }
}

dependencies {
    // Shizuku：让本 App 能像那些「AI 操控手机」开源项目一样，
    // 由用户点一次「允许」后拿到系统级（shell / root）能力，用于自动授权。
    // 版本 13.1.5 已实测可从 Maven Central 解析，类签名已核对。
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    // 调用系统隐藏 API（IPackageManager.grantRuntimePermission）时豁免 P+ 限制。
    // 纯 Java、8KB；已实测 Maven Central 可拉取。失败时代码会静默回落到系统弹框。
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
