plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zjh1934.mausbot.local'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zjh1934.mausbot.local'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.9.0'
    }

    buildTypes {
        debug {
            // debug 使用 Android 自带调试签名，产物可直接安装
            debuggable true
        }
        release {
            minifyEnabled false
            // 未配置正式签名；release 产物用于体验，安装以 debug 包为准
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 固定产物名，便于 Actions 上传与用户识别
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "mausbot-local-${variant.name}.apk"
        }
    }
}

// 刻意不引入 AndroidX / 任何远程依赖：全部使用 Android framework 原生 API，
// 最大程度降低 CI 编译失败概率。
dependencies {
}
